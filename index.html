        <div id="mainMenu" class="section active">
            <h1>Wizard - Der Block der Wahrheit</h1>
            <p>ein digitaler Block der Wahrheit</p>
            <div class="stack">
                <button data-nextSection="game" id="weiterspielerBtn" style="display: none;">Weiterspielen</button>
                <button data-nextSection="game" id="startBtn">Neues Spiel</button>
                <button data-nextSection="settings" id="settingsBtn">Einstellungen</button>
                <button>Spiel importieren</button>
            </div>
        </div>

        <div id="settings" class="section">
            <div class="stack">
                <h1>Einstellungen</h1>
                <div>
                    <label for="richtigPkt">Punkte für eine richtige Vorhersage:</label>
                    <br>
                    <input data-setting="RICHTIGE_ANSAGE_PUNKTE" min="0" type="number" id="richtigPkt" value="20">
                </div>
                <div>
                    <label for="falschPkt">Minuspunkte für eine falsche Vorhersage:</label>
                    <br>
                    <input data-setting="FALSCHE_ANSAGE_MINUS_PUNKTE" min="0" type="number" id="falschPkt" value="0">
                </div>
                <div>
                    <label for="richtigProStichPkt">Punkte pro Stich bei einer richtigen Vorhersage:</label>
                    <br>
                    <input data-setting="RICHTIGE_VORHERSAGE_PUNKTE_PRO_STICH" min="0" type="number" id="richtigProStichPkt" value="10">
                </div>
                <div>
                    <label for="flaschProStichPkt">Minuspunkt pro falschem Stich bei einer falschen Vorhersage:</label>
                    <br>
                    <input data-setting="FALSCHE_VORHERSAGE_MINSU_PUNKTE_PRO_STICH" min="0" type="number" id="falschProStichPkt" value="10">
                </div>
                <div>
                    <label for="proStichPkt">Punkte pro Stich:</label>
                    <br>
                    <input data-setting="PUNKTE_PRO_STICH" min="0" type="number" id="proStichPkt" value="0">
                </div>
                <div class="h_stack">
                    <button data-nextSection="mainMenu" id="backBtn">Hauptmenu</button>
                    <button id="resetBtn">Zurücksetzen</button>
                </div>
            </div>
        </div>
